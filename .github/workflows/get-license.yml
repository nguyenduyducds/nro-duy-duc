name: Lay File Kich Hoat Unity (ALF)

on:
  workflow_dispatch: {}

jobs:
  requestManualActivation:
    name: Request manual activation file
    runs-on: ubuntu-latest
    container:
      image: unityci/editor:ubuntu-2022.3.62f2-base-3
    steps:
      - name: Generate ALF file
        run: |
          unity-editor -batchmode -nographics -quit -createManualActivationFile || true
          ls -la *.alf

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Unity_v2022.3.62f2.alf
          path: "*.alf"
